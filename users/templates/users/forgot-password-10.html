{% load crispy_forms_tags %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - RecruitSmart</title>
  <link rel="stylesheet" href="{% static 'user/css/forgot.css' %}" />
  <link rel="icon" type="image/x-icon" href="{% static 'dashboard/img/icons/logo_1.png' %}" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Logo -->
      <div class="logo-container">
        <img src="{% static 'dashboard/img/icons/logo.png' %}" alt="RecruitSmart Logo">
      </div>

      <!-- Heading -->
      <h2 class="login-title">Forgot Password 🔒</h2>
      <p class="login-subtext">Enter your email and we'll send you instructions to reset your password</p>

      <!-- Form -->
      <form id="formAuthentication" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="text"
            class="form-control"
            id="email"
            name="email"
            placeholder="Enter your email"
            autofocus />
          {% for error in form.email.errors %}
            <div class="error-message text-danger">{{ error }}</div>
          {% endfor %}
        </div>

        <!-- Submit Button with animated border -->
        <div class="login-button-wrapper">
          <button type="submit" class="login-button">Send Reset Link</button>
        </div>
      </form>

      <!-- Link back to login -->
      <p class="bottom-text">
        <a href="{% url 'login' %}">&larr; Back to login</a>
      </p>
    </div>
  </div>
</body>
</html>
